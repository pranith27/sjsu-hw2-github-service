[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicit opt-in integration against a running GitHub-connected service"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
include_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
