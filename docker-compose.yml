services:
  api:
    build: .
    env_file: .env
    environment:
      PORT: "${PORT:-8000}"
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','8000')+'/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
