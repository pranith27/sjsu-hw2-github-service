      - id
      - body
      - user
      - created_at
      - html_url
      title: CommentResponse
      examples:
      - body: Confirmed the fix.
        created_at: '2026-09-01T00:00:00Z'
        html_url: https://github.com/example/repo/issues/1#issuecomment-2
        id: 2
        user: example
    CreateCommentRequest:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
      type: object
      required:
      - body
      title: CreateCommentRequest
      examples:
      - body: Confirmed the fix.
    CreateIssueRequest:
      properties:
        title:
          type: string
          maxLength: 256
          minLength: 1
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
      type: object
      required:
      - title
      title: CreateIssueRequest
      examples:
      - body: Steps to reproduce
        labels:
        - bug
        title: Fix login
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
        detail:
          title: Detail
      type: object
      required:
      - error
      title: ErrorResponse
      examples:
      - detail: Not Found
        error: not_found
    EventResponse:
      properties:
        delivery_id:
          type: string
          title: Delivery Id
        event:
          type: string
          title: Event
        action:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
        issue_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Issue Number
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - delivery_id
      - event
      - action
      - issue_number
      - timestamp
      title: EventResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IssueResponse:
      properties:
        number:
          type: integer
          title: Number
        html_url:
          type: string
          title: Html Url
        state:
          type: string
          title: State
        title:
          type: string
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          items:
            type: string
          type: array
          title: Labels
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - number
      - html_url
      - state
      - title
      - body
      - labels
      - created_at
      - updated_at
      title: IssueResponse
      examples:
      - created_at: '2026-09-01T00:00:00Z'
        html_url: https://github.com/example/repo/issues/1
        labels:
        - bug
        number: 1
        state: open
        title: Fix login
        updated_at: '2026-09-01T00:00:00Z'
    UpdateIssueRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
