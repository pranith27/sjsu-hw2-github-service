openapi: 3.1.0
info:
  title: GitHub Issues Service API
  summary: REST API wrapper for GitHub Issues
  description: '

    A production-style REST API built with **FastAPI** that wraps the GitHub REST
    API

    for managing issues and comments within a single GitHub repository.


    ## Features


    - Create GitHub Issues

    - List Repository Issues

    - Retrieve Individual Issues

    - Update Issue Title, Body, and State

    - Add Comments to Issues

    - Verify GitHub Webhook Signatures (HMAC SHA-256)

    - Process Issue and Issue Comment Events

    - Store Webhook Events for Debugging

    - OpenAPI 3.1 Documentation

    - Docker Support

    - Automated Unit Tests


    Developed as part of **CMPE 272 - Homework #2**.

    '
  version: 1.0.0
paths:
  /:
    get:
      tags:
      - Health
      summary: Root Endpoint
      description: Returns basic information about the GitHub Issues Service API.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      tags:
      - Health
      summary: Health Check
      description: Returns the current health status of the application.
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /issues:
    post:
      tags:
      - Issues
      summary: Create Issue
      operationId: create_issue_issues_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Issues
      summary: List Issues
      operationId: list_issues_issues_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          default: open
          title: State
      - name: labels
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Labels
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Per Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/{issue_number}:
    get:
      tags:
      - Issues
      summary: Get Issue
      operationId: get_issue_issues__issue_number__get
      parameters:
      - name: issue_number
        in: path
        required: true
        schema:
          type: integer
          title: Issue Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Issues
      summary: Update Issue
      operationId: update_issue_issues__issue_number__patch
      parameters:
      - name: issue_number
        in: path
        required: true
        schema:
          type: integer
          title: Issue Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/{issue_number}/comments:
    post:
      tags:
      - Issues
      summary: Create Comment
      operationId: create_comment_issues__issue_number__comments_post
      parameters:
      - name: issue_number
        in: path
        required: true
        schema:
          type: integer
          title: Issue Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook:
    post:
      tags:
      - Webhook
      summary: Github Webhook
      operationId: github_webhook_webhook_post
      parameters:
      - name: x-hub-signature-256
        in: header
        required: false
        schema:
          type: string
          title: X-Hub-Signature-256
      - name: x-github-event
        in: header
        required: false
        schema:
          type: string
          title: X-Github-Event
      - name: x-github-delivery
        in: header
        required: false
        schema:
          type: string
          title: X-Github-Delivery
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook/events:
    get:
      tags:
      - Webhook
      summary: Events
      description: Return recently processed webhook events.
      operationId: events_webhook_events_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CreateCommentRequest:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
      type: object
      required:
      - body
      title: CreateCommentRequest
    CreateIssueRequest:
      properties:
        title:
          type: string
          maxLength: 256
          minLength: 1
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
          default: []
      type: object
      required:
      - title
      title: CreateIssueRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UpdateIssueRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        state:
          anyOf:
          - type: string
            pattern: ^(open|closed)$
          - type: 'null'
          title: State
      type: object
      title: UpdateIssueRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

