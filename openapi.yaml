  /webhook:
    post:
      tags:
      - Webhook
      summary: Github Webhook
      operationId: github_webhook_webhook_post
      parameters:
      - name: x-hub-signature-256
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Hub-Signature-256
      - name: x-github-event
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Github-Event
      - name: x-github-delivery
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Github-Delivery
      responses:
        '204':
          description: Successful Response
          headers:
            X-Request-ID:
              description: Request correlation ID
              schema:
                type: string
        '400':
          description: Invalid event, delivery ID or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: Request correlation ID
              schema:
                type: string
        '401':
          description: Invalid or missing HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: Request correlation ID
              schema:
                type: string
        '413':
          description: Webhook body exceeds 25 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: Request correlation ID
              schema:
                type: string
      requestBody:
        required: true
        description: Raw GitHub JSON, at most 25 MiB. Sign the exact request bytes
          with HMAC-SHA256 in X-Hub-Signature-256; send X-GitHub-Event and a nonempty
          X-GitHub-Delivery. issues and issue_comment require a supported action and
          a positive issue.number; ping requires only a JSON object.
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - assigned
                  - closed
                  - created
                  - deleted
                  - demilestoned
                  - edited
                  - field_added
                  - field_removed
                  - labeled
                  - locked
                  - milestoned
                  - opened
                  - pinned
                  - reopened
                  - transferred
                  - typed
                  - unassigned
                  - unlabeled
                  - unlocked
                  - unpinned
                  - untyped
                issue:
                  type: object
                  properties:
                    number:
                      type: integer
                      minimum: 1
                  required:
                  - number
            examples:
              issues_opened:
                summary: 'X-GitHub-Event: issues'
                value:
                  action: opened
                  issue:
                    number: 1
              comment_created:
                summary: 'X-GitHub-Event: issue_comment'
                value:
                  action: created
                  issue:
                    number: 1
              ping:
                summary: 'X-GitHub-Event: ping'
                value:
                  zen: Keep it logically awesome.
